name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proxy traffic and daemon authentication boundaries
        run: python tests/integration_proxy.py --local-mtproto
  spec-kit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-speckit.txt
      - run: specify version
      - name: Official generator smoke test
        run: specify init "${{ runner.temp }}/freenet-speckit-smoke" --integration codex --integration-options=--skills --script py --ignore-agent-tools --non-interactive
      - name: Official feature context and template checks
        run: python tools/check_spec_contexts.py
      - name: Read-only structural audit (not LLM analysis)
        run: python tools/spec_audit.py
      - name: Adversarial artifact and actual API contract tests
        run: python -m pytest tests/test_spec_audit.py tests/test_contracts.py -q
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Downloaded installer bootstrap
        run: sudo bash tests/bootstrap.sh
      - name: Shell syntax and lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          for file in install.sh menu.sh restore.sh scripts/*.sh services/*/*.sh tests/bootstrap.sh; do bash -n "$file"; done
          shellcheck --severity=warning --external-sources --exclude=SC1091 install.sh menu.sh restore.sh scripts/*.sh services/*/*.sh tests/bootstrap.sh
  linux-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable runner WireGuard module
        run: sudo modprobe wireguard
      - name: Actual TLS and VPN integration
        run: python tests/integration.py
      - name: Container status on failure
        if: failure()
        run: docker ps -a
  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots-simulated-api
          path: runtime/ui-screenshots
  extra-protocols:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable IPsec, PPP and TUN
        run: |
          sudo modprobe af_key
          sudo modprobe ppp_generic
          sudo modprobe ppp_async
          sudo modprobe tun
          test -c /dev/ppp || sudo mknod /dev/ppp c 108 0
      - name: Actual IKEv2, L2TP, Outline and AmneziaWG traffic
        run: python tests/integration_extra.py
