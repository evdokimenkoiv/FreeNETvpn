name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Shell syntax and lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          for file in install.sh menu.sh restore.sh scripts/*.sh; do bash -n "$file"; done
          shellcheck --severity=warning --external-sources --exclude=SC1091 install.sh menu.sh restore.sh scripts/*.sh
  linux-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable runner WireGuard module
        run: sudo modprobe wireguard
      - name: Actual TLS and VPN integration
        run: python tests/integration.py
      - name: Container status on failure
        if: failure()
        run: docker ps -a
