name: freenetvpn
services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv/site:ro
      - ./data/caddy:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      admin:
        condition: service_healthy

  admin:
    build: ./admin
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./runtime/admin.json:/run/freenet/admin.json:ro
      - ./backups:/srv/backups:ro
    networks: [backend]

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    profiles: [wireguard]
    restart: unless-stopped
    # UI readiness must work before the operator completes the first-run wizard.
    # A WireGuard handshake is checked separately by integration/acceptance tests.
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:51821/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      INSECURE: "false"
      DISABLE_IPV6: "true"
      HOST: "0.0.0.0"
      PORT: "51821"
    ports:
      - "${WG_PORT:?Run tools/manage.py configure}:${WG_PORT}/udp"
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - ./data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks: [backend]

  xray:
    image: ghcr.io/xtls/xray-core:26.3.27
    profiles: [vless]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["run", "-config", "/etc/xray/config.json"]
    volumes:
      - ./runtime/xray.json:/etc/xray/config.json:ro
    networks: [backend]

networks:
  backend: {}
volumes:
  caddy_config: {}
