name: freenetvpn
services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv/site:ro
      - ./data/caddy:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      admin:
        condition: service_healthy

  admin:
    build: ./admin
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./runtime/admin.json:/run/freenet/admin.json:ro
      - ./backups:/srv/backups:ro
      - ${FREENET_CONTROL_DIR:-/run/freenetvpn}:/run/freenet-control:ro
    networks: [backend]

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    profiles: [wireguard]
    restart: unless-stopped
    # UI readiness must work before the operator completes the first-run wizard.
    # A WireGuard handshake is checked separately by integration/acceptance tests.
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:51821/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      INSECURE: "false"
      DISABLE_IPV6: "true"
      HOST: "0.0.0.0"
      PORT: "51821"
    ports:
      - "${WG_PORT:?Run tools/manage.py configure}:${WG_PORT}/udp"
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - ./data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks: [backend]

  xray:
    image: ghcr.io/xtls/xray-core:26.3.27
    profiles: [vless]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["run", "-config", "/etc/xray/config.json"]
    volumes:
      - ./runtime/xray.json:/etc/xray/config.json:ro
    networks: [backend]

  ipsec:
    build: ./services/ipsec
    profiles: [ikev2, l2tp]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/ppp:/dev/ppp]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
    env_file: ./runtime/ipsec.env
    ports: ["500:500/udp", "4500:4500/udp"]
    volumes:
      - ./runtime/ipsec:/config:ro
      - ./data/ipsec:/etc/ipsec.d
    networks: [backend]

  outline:
    image: quay.io/outline/shadowbox@sha256:545c6f7c7261bb30ae1dffe24a6fca5f8512f5d17c72cfb9e410e7e655444e62
    profiles: [outline]
    restart: unless-stopped
    env_file: ./runtime/outline.env
    environment:
      SB_STATE_DIR: /data
      SB_API_PORT: "9090"
      SB_CERTIFICATE_FILE: /data/api.crt
      SB_PRIVATE_KEY_FILE: /data/api.key
      SB_METRICS_URL: ""
    ports:
      - "127.0.0.1:${OUTLINE_API_PORT:-19090}:9090/tcp"
      - "${OUTLINE_PORT:-2443}:${OUTLINE_PORT:-2443}/tcp"
      - "${OUTLINE_PORT:-2443}:${OUTLINE_PORT:-2443}/udp"
    volumes: ["./data/outline:/data"]
    networks: [backend]

  amnezia:
    build: ./services/amnezia
    profiles: [amnezia]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "1"
    ports: ["${AWG_PORT:-51830}:${AWG_PORT:-51830}/udp"]
    volumes: ["./runtime/amnezia:/config:ro"]
    networks: [backend]

  proxy:
    image: ghcr.io/xtls/xray-core:26.3.27
    profiles: [proxy]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["run", "-config", "/etc/xray/config.json"]
    ports: ["${HTTP_PROXY_PORT:-3128}:3128/tcp", "${SOCKS_PROXY_PORT:-1080}:1080/tcp"]
    volumes: ["./runtime/proxy.json:/etc/xray/config.json:ro"]
    networks: [proxy_egress]

  mtproto:
    build: ./services/mtproto
    profiles: [mtproto]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    ports: ["${MTPROTO_PORT:-8443}:8443/tcp"]
    volumes: ["./runtime/mtproto.json:/config/mtproto.json:ro", "./data/mtproto:/data"]
    networks: [proxy_egress]

networks:
  backend: {}
  proxy_egress: {}
volumes:
  caddy_config: {}
